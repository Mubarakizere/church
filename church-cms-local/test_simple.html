<!DOCTYPE html>
<html>
<head>
    <title>Simple API Test</title>
</head>
<body>
    <h1>Simple API Test</h1>
    <div id="results"></div>

    <script>
        async function testAPI() {
            const results = document.getElementById('results');
            
            try {
                console.log('Testing API endpoints...');
                
                // Test health centers
                const healthResponse = await fetch('http://localhost:8000/api/health-centers');
                console.log('Health Centers Status:', healthResponse.status);
                const healthData = await healthResponse.json();
                console.log('Health Centers Data:', healthData);
                
                // Test schools
                const schoolsResponse = await fetch('http://localhost:8000/api/schools');
                console.log('Schools Status:', schoolsResponse.status);
                const schoolsData = await schoolsResponse.json();
                console.log('Schools Data:', schoolsData);
                
                results.innerHTML = `
                    <h3>Health Centers (${healthData.length})</h3>
                    <pre>${JSON.stringify(healthData, null, 2)}</pre>
                    
                    <h3>Schools (${schoolsData.length})</h3>
                    <pre>${JSON.stringify(schoolsData, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                results.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        testAPI();
    </script>
</body>
</html>
